<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#ffd52a">
	<title>BrightPath BP</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			--yellow: #ffd52a;
			--ink: #171710;
			--paper: #fff9e8;
			--green: #315d45;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			overflow-x: hidden;
			background: var(--yellow);
			color: var(--ink);
			font-family: "Manrope", sans-serif;
		}

		.page {
			position: relative;
			display: flex;
			min-height: 100vh;
			flex-direction: column;
			isolation: isolate;
			overflow: hidden;
		}

		.page::before {
			position: absolute;
			z-index: -1;
			top: -16rem;
			right: -12rem;
			width: min(68vw, 58rem);
			aspect-ratio: 1;
			border: 1px solid rgb(23 23 16 / 13%);
			border-radius: 50%;
			box-shadow: 0 0 0 3rem rgb(23 23 16 / 3%), 0 0 0 7rem rgb(23 23 16 / 3%);
			content: "";
		}

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			width: min(100% - 3rem, 84rem);
			margin: 0 auto;
			padding: 1.5rem 0;
			border-bottom: 1px solid rgb(23 23 16 / 25%);
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 0.7rem;
			color: inherit;
			font-size: 1.05rem;
			font-weight: 800;
			letter-spacing: 0.02em;
			text-decoration: none;
		}

		.brand-mark {
			display: grid;
			width: 2.7rem;
			height: 2.7rem;
			place-items: center;
			border: 1.5px solid var(--ink);
			border-radius: 50%;
		}

		.brand-mark svg { width: 1.55rem; height: 1.55rem; }

		.top-note {
			display: flex;
			align-items: center;
			gap: 0.55rem;
			font-size: 0.72rem;
			font-weight: 800;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		.top-note::before {
			width: 0.48rem;
			height: 0.48rem;
			border-radius: 50%;
			background: var(--green);
			content: "";
		}

		main {
			display: grid;
			flex: 1;
			width: min(100% - 3rem, 84rem);
			margin: 0 auto;
			padding: clamp(4rem, 10vh, 8rem) 0;
			align-content: center;
			grid-template-columns: minmax(0, 1fr) minmax(10rem, 19rem);
			align-items: center;
			gap: clamp(2rem, 7vw, 8rem);
		}

		.intro { max-width: 52rem; }

		.eyebrow {
			display: inline-flex;
			align-items: center;
			gap: 0.65rem;
			margin: 0 0 1.6rem;
			font-size: 0.75rem;
			font-weight: 800;
			letter-spacing: 0.18em;
			text-transform: uppercase;
		}

		.eyebrow::before {
			width: 2.2rem;
			height: 2px;
			background: var(--ink);
			content: "";
		}

		h1 {
			margin: 0;
			font-family: "Fraunces", Georgia, serif;
			font-size: clamp(4rem, 11.4vw, 10.5rem);
			font-weight: 700;
			letter-spacing: -0.065em;
			line-height: 0.84;
		}

		h1 span { display: block; }
		h1 span + span { margin-left: 0.48em; }

		.tagline {
			max-width: 25rem;
			margin: 2.25rem 0 0 0.4rem;
			font-size: clamp(1rem, 1.5vw, 1.2rem);
			font-weight: 600;
			line-height: 1.55;
		}

		.catalog {
			width: min(100% - 3rem, 84rem);
			margin: 0 auto;
			padding: 2.5rem 0 5rem;
			border-top: 1px solid rgb(23 23 16 / 25%);
		}

		.catalog-head {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 1.5rem;
			margin-bottom: 1.5rem;
		}

		.catalog-title { margin: 0; font: 700 2rem/1 "Fraunces", Georgia, serif; }

		.catalog-count {
			margin: 0.5rem 0 0;
			color: rgb(23 23 16 / 68%);
			font-size: 0.85rem;
		}

		.search-wrap {
			display: flex;
			width: min(100%, 20rem);
			align-items: center;
			gap: 0.65rem;
			padding: 0.8rem 0.95rem;
			border: 1px solid rgb(23 23 16 / 58%);
			background: var(--paper);
		}

		.search-wrap svg { width: 1.1rem; height: 1.1rem; flex: none; }

		.search-wrap input {
			width: 100%;
			min-width: 0;
			border: 0;
			outline: 0;
			background: transparent;
			color: var(--ink);
			font: inherit;
			font-size: 0.9rem;
		}

		.game-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(min(100%, 12rem), 1fr));
			gap: 1rem;
		}

		.game-card {
			display: flex;
			min-width: 0;
			flex-direction: column;
			padding: 0;
			overflow: hidden;
			border: 1px solid rgb(23 23 16 / 22%);
			background: var(--paper);
			color: var(--ink);
			text-align: left;
			cursor: pointer;
			transition: transform 160ms ease, border-color 160ms ease;
		}

		.game-card:hover { transform: translateY(-3px); border-color: var(--ink); }
		.game-card:focus-visible, .icon-button:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }

		.game-art {
			display: block;
			width: 100%;
			aspect-ratio: 16 / 10;
			background: #f1e8c6;
			object-fit: cover;
		}

		.game-card-copy { display: flex; min-height: 4.4rem; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.85rem; }
		.game-name { overflow: hidden; font-size: 0.9rem; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
		.game-play { display: grid; width: 2rem; height: 2rem; flex: none; place-items: center; border-radius: 50%; background: var(--yellow); }
		.game-play svg { width: 0.85rem; height: 0.85rem; }

		.catalog-message { min-height: 7rem; display: grid; place-items: center; color: rgb(23 23 16 / 70%); text-align: center; }
		.catalog-message[hidden] { display: none; }

		.player {
			position: fixed;
			z-index: 20;
			inset: 0;
			display: grid;
			grid-template-rows: auto minmax(0, 1fr);
			padding: clamp(0.5rem, 2vw, 1.25rem);
			background: rgb(16 16 12 / 93%);
		}

		.player[hidden] { display: none; }

		.player-bar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1rem;
			padding: 0 0 0.75rem;
			color: #fff9e8;
		}

		.player-name { overflow: hidden; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
		.player-actions { display: flex; align-items: center; gap: 0.5rem; }

		.icon-button {
			display: grid;
			width: 2.6rem;
			height: 2.6rem;
			place-items: center;
			border: 1px solid rgb(255 249 232 / 48%);
			background: transparent;
			color: inherit;
			cursor: pointer;
		}

		.icon-button:hover { background: rgb(255 249 232 / 12%); }
		.icon-button svg { width: 1.15rem; height: 1.15rem; }

		.player-frame {
			width: 100%;
			height: 100%;
			min-height: 0;
			border: 0;
			background: #111;
		}

		.bulb-art {
			display: grid;
			width: 100%;
			aspect-ratio: 1;
			place-items: center;
			border: 1px solid rgb(23 23 16 / 28%);
			border-radius: 50%;
			background: var(--paper);
			animation: arrive 700ms cubic-bezier(.2,.75,.25,1) both;
		}

		.bulb-art svg { width: 53%; height: 53%; overflow: visible; }

		footer {
			display: flex;
			width: min(100% - 3rem, 84rem);
			justify-content: space-between;
			margin: 0 auto;
			padding: 1.15rem 0;
			border-top: 1px solid rgb(23 23 16 / 25%);
			font-size: 0.68rem;
			font-weight: 800;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		@keyframes arrive {
			from { opacity: 0; transform: translateY(1rem) rotate(-7deg); }
			to { opacity: 1; transform: translateY(0) rotate(0); }
		}

		@media (max-width: 680px) {
			.topbar, main, .catalog, footer { width: min(100% - 2rem, 84rem); }
			.topbar { padding: 1rem 0; }
			.brand { font-size: 0.95rem; }
			.brand-mark { width: 2.35rem; height: 2.35rem; }
			.top-note { font-size: 0.6rem; letter-spacing: 0.08em; }
			main {
				padding: 4.5rem 0 3.5rem;
				grid-template-columns: 1fr;
				gap: 2.5rem;
			}
			h1 { font-size: clamp(3.6rem, 18vw, 7rem); }
			.tagline { margin-top: 1.6rem; }
			.bulb-art { width: min(48vw, 12rem); justify-self: end; }
			footer { font-size: 0.58rem; }
			.catalog { padding-top: 2rem; }
			.catalog-head { align-items: stretch; flex-direction: column; gap: 1rem; }
			.search-wrap { width: 100%; }
			.game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.65rem; }
			.game-card-copy { min-height: 3.9rem; padding: 0.65rem; }
			.game-name { font-size: 0.78rem; }
			.game-play { width: 1.7rem; height: 1.7rem; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<div class="page">
		<header class="topbar">
			<a class="brand" href="#home" aria-label="BrightPath BP home">
				<span class="brand-mark" aria-hidden="true">
					<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M13 17a7 7 0 1 1 14 0c0 3-2 4.6-3.5 6.3-.8.9-1.1 1.8-1.2 3.2h-4.6c-.1-1.4-.4-2.3-1.2-3.2C15 21.6 13 20 13 17Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
						<path d="M18 30h4m-3.4 3h2.8M20 3v3m12 11h3M5 17h3m20.5-8.5 2.1-2.1M9.4 8.5 7.3 6.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
					</svg>
				</span>
				<span>BrightPath BP</span>
			</a>
			<span class="top-note">A brighter way forward</span>
		</header>

		<main id="home">
			<section class="intro" aria-labelledby="title">
				<p class="eyebrow">Bright ideas start here</p>
				<h1 id="title"><span>BrightPath</span><span>BP</span></h1>
				<p class="tagline">Big ideas. Clear direction. A bright path to what comes next.</p>
			</section>

			<div class="bulb-art" role="img" aria-label="A glowing lightbulb with rays">
				<svg viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M55 76a35 35 0 1 1 70 0c0 15-10 23-17 32-4 5-6 10-6 17H78c0-7-2-12-6-17-7-9-17-17-17-32Z" fill="#FFD52A" stroke="#171710" stroke-width="5" stroke-linejoin="round"/>
					<path d="M78 137h24m-20 12h16m-8-162v14m66 75h-14M38 76H24m117-47-10 10M49 39 39 29" stroke="#171710" stroke-width="5" stroke-linecap="round"/>
					<path d="M79 96c4 4 7 6 11 6s7-2 11-6" stroke="#171710" stroke-width="4" stroke-linecap="round"/>
				</svg>
			</div>
		</main>

		<section class="catalog" aria-labelledby="catalog-title">
			<div class="catalog-head">
				<div>
					<h2 class="catalog-title" id="catalog-title">Game library</h2>
					<p class="catalog-count" id="catalog-count" aria-live="polite">Loading games...</p>
				</div>
				<label class="search-wrap">
					<svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
						<circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/>
						<path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
					</svg>
					<input id="game-search" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games">
				</label>
			</div>
			<div class="game-grid" id="game-grid"></div>
			<p class="catalog-message" id="catalog-message" role="status">Loading game library...</p>
		</section>

		<section class="player" id="game-player" role="dialog" aria-modal="true" aria-labelledby="player-name" hidden>
			<div class="player-bar">
				<div class="player-name" id="player-name">Game</div>
				<div class="player-actions">
					<a class="icon-button" id="open-game" href="#" target="_blank" rel="noopener" aria-label="Open game in a new tab" title="Open in new tab">
						<svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M14 4h6v6m0-6-9 9M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
					</a>
					<button class="icon-button" id="close-game" type="button" aria-label="Close game" title="Close game">
						<svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
					</button>
				</div>
			</div>
			<iframe class="player-frame" id="game-frame" title="Game" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"></iframe>
		</section>

		<footer>
			<span>BrightPath BP</span>
			<span>Learn with purpose</span>
		</footer>
	</div>
	<script>
		const catalogUrl = "https://hqlgppguxhqeaonjzinv.supabase.co/rest/v1/apps";
		const catalogKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxbGdwcGd1eGhxZWFvbmp6aW52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzI2MjYwNDQsImV4cCI6MjA0ODIwMjA0NH0.4LuWk4qxp0NRZ5_erEIJq5BHq5qZiSE4zTUFS1ioZw8";
		const gameGrid = document.getElementById("game-grid");
		const gameSearch = document.getElementById("game-search");
		const catalogCount = document.getElementById("catalog-count");
		const catalogMessage = document.getElementById("catalog-message");
		const gamePlayer = document.getElementById("game-player");
		const gameFrame = document.getElementById("game-frame");
		const playerName = document.getElementById("player-name");
		const openGame = document.getElementById("open-game");
		let games = [];

		function displayName(title) {
			return title.replace(/[-_]+/g, " ").replace(/\b\w/g, letter => letter.toUpperCase());
		}

		function openPlayer(game) {
			const url = new URL(game.link);
			if (url.protocol !== "https:") return;
			playerName.textContent = game.name;
			gameFrame.title = game.name;
			gameFrame.src = url.href;
			openGame.href = url.href;
			gamePlayer.hidden = false;
			document.body.style.overflow = "hidden";
			document.getElementById("close-game").focus();
		}

		function closePlayer() {
			gamePlayer.hidden = true;
			gameFrame.removeAttribute("src");
			openGame.href = "#";
			document.body.style.overflow = "";
		}

		function renderGames() {
			const query = gameSearch.value.trim().toLowerCase();
			const visibleGames = games.filter(game => game.name.toLowerCase().includes(query));
			gameGrid.replaceChildren();
			catalogCount.textContent = query ? `${visibleGames.length} of ${games.length} games` : `${games.length} games`;
			catalogMessage.hidden = visibleGames.length > 0;
			if (!visibleGames.length) {
				catalogMessage.textContent = games.length ? "No games match that search." : "No games are available right now.";
				return;
			}

			const cards = document.createDocumentFragment();
			for (const game of visibleGames) {
				const card = document.createElement("button");
				card.className = "game-card";
				card.type = "button";
				card.setAttribute("aria-label", `Play ${game.name}`);
				card.addEventListener("click", () => openPlayer(game));

				if (game.icon) {
					const image = document.createElement("img");
					image.className = "game-art";
					image.src = game.icon;
					image.alt = "";
					image.loading = "lazy";
					image.referrerPolicy = "no-referrer";
					image.addEventListener("error", () => image.remove(), { once: true });
					card.append(image);
				}

				const copy = document.createElement("span");
				copy.className = "game-card-copy";
				const name = document.createElement("span");
				name.className = "game-name";
				name.textContent = game.name;
				const play = document.createElement("span");
				play.className = "game-play";
				play.setAttribute("aria-hidden", "true");
				play.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M4 2.7v10.6a.7.7 0 0 0 1.06.6l8.1-5.3a.7.7 0 0 0 0-1.2l-8.1-5.3A.7.7 0 0 0 4 2.7Z"/></svg>';
				copy.append(name, play);
				card.append(copy);
				cards.append(card);
			}
			gameGrid.append(cards);
		}

		async function loadGames() {
			const params = new URLSearchParams({
				select: "id,title,link,icon,is_listed,hidden,game_score",
				is_listed: "eq.true",
				hidden: "eq.false",
				order: "game_score.desc",
				limit: "500"
			});
			try {
				const response = await fetch(`${catalogUrl}?${params}`, {
					headers: { apikey: catalogKey, Authorization: `Bearer ${catalogKey}` }
				});
				if (!response.ok) throw new Error(`Catalog request failed (${response.status})`);
				const records = await response.json();
				games = records.filter(game => typeof game.title === "string" && typeof game.link === "string")
					.map(game => ({ ...game, name: displayName(game.title) }));
				catalogMessage.textContent = "";
				renderGames();
			} catch (error) {
				catalogCount.textContent = "Game library unavailable";
				catalogMessage.textContent = "The game list could not load. Check your connection and reload the page.";
				console.error("BrightPath game catalog failed to load", error);
			}
		}

		gameSearch.addEventListener("input", renderGames);
		document.getElementById("close-game").addEventListener("click", closePlayer);
		gamePlayer.addEventListener("click", event => {
			if (event.target === gamePlayer) closePlayer();
		});
		document.addEventListener("keydown", event => {
			if (event.key === "Escape" && !gamePlayer.hidden) closePlayer();
		});
		loadGames();
	</script>
</body>
</html>
